<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lengkapi SOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-full font-sans text-slate-800 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-2xl items-center gap-3 px-4 py-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white">L</div>
      <div class="leading-tight">
        <p class="text-sm font-semibold text-slate-900">Lengkapi SOP</p>
        <p class="text-xs text-slate-500">Latihan SOP interaktif</p>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-4 py-6 pb-16">

    <!-- MULAI -->
    <section id="screen-start" class="space-y-4">
      <div id="resume-box" class="card hidden border-l-4 border-amber-400">
        <p class="text-sm font-semibold text-slate-900">Ada kuis yang belum selesai</p>
        <p id="resume-text" class="mt-1 text-sm text-slate-600"></p>
        <div class="mt-3 flex gap-2">
          <button id="btn-resume" class="btn btn-primary">Lanjutkan</button>
          <button id="btn-discard" class="btn btn-secondary">Buang</button>
        </div>
      </div>

      <div class="card">
        <h1 class="text-xl font-bold text-slate-900">Mulai latihan</h1>
        <p class="mt-1 text-sm text-slate-500">Lengkapi kalimat SOP yang rumpang atau pilih jawaban yang benar. Soal diacak setiap kali kamu mulai.</p>
        <form id="start-form" class="mt-5 space-y-4" autocomplete="off">
          <div>
            <label class="label" for="f-nama">Nama</label>
            <input id="f-nama" class="input" type="text" placeholder="Nama lengkap" required>
          </div>
          <div>
            <label class="label" for="f-outlet">Asal outlet</label>
            <select id="f-outlet" class="input" required></select>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label class="label" for="f-topic">Topik SOP</label>
              <select id="f-topic" class="input"></select>
            </div>
            <div>
              <label class="label" for="f-count">Jumlah soal</label>
              <select id="f-count" class="input"></select>
            </div>
          </div>
          <p id="avail" class="text-xs text-slate-500"></p>
          <button id="btn-start" type="submit" class="btn btn-primary w-full" disabled>Mulai kuis</button>
        </form>
      </div>
      <p id="bank-info" class="text-center text-xs text-slate-400"></p>
    </section>

    <!-- KUIS -->
    <section id="screen-quiz" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <p id="q-count" class="text-sm font-medium text-slate-600"></p>
        <div class="flex items-center gap-3">
          <span id="q-score" class="badge bg-indigo-50 text-indigo-700"></span>
          <button id="btn-exit" class="text-sm font-medium text-slate-500 hover:text-slate-800">Keluar</button>
        </div>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-slate-200" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="q-progress-wrap">
        <div id="q-progress" class="h-full rounded-full bg-indigo-600 transition-all duration-300" style="width:0%"></div>
      </div>

      <div class="card">
        <span id="q-topic" class="badge bg-slate-100 text-slate-600"></span>
        <p id="q-hint" class="mt-3 text-sm text-slate-500"></p>
        <div id="q-body" class="mt-3"></div>
        <div id="q-feedback" class="mt-5 hidden"></div>
        <div class="mt-5 flex justify-end">
          <button id="btn-check" class="btn btn-primary">Periksa jawaban</button>
          <button id="btn-next" class="btn btn-primary hidden">Lanjut</button>
        </div>
      </div>
    </section>

    <!-- HASIL -->
    <section id="screen-result" class="hidden space-y-4">
      <div class="card text-center">
        <p class="text-sm font-medium text-slate-500" id="r-who"></p>
        <div class="relative mx-auto mt-4 h-40 w-40">
          <svg viewBox="0 0 120 120" class="h-40 w-40 -rotate-90">
            <circle cx="60" cy="60" r="54" fill="none" stroke-width="10" class="stroke-slate-200"></circle>
            <circle id="r-ring" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="339.29" class="stroke-indigo-600 transition-all duration-700"></circle>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="r-pct" class="text-4xl font-bold text-slate-900"></span>
            <span id="r-pts" class="text-xs text-slate-500"></span>
          </div>
        </div>
        <span id="r-badge" class="badge mt-4"></span>
        <p id="r-sync" class="mt-3 text-xs text-slate-500"></p>
        <p id="r-msg" class="mt-2 text-sm text-slate-600"></p>
        <div class="mt-5 flex flex-wrap justify-center gap-2">
          <button id="btn-again" class="btn btn-primary">Ulangi dengan soal baru</button>
          <button id="btn-copy" class="btn btn-secondary">Salin hasil</button>
          <button id="btn-home" class="btn btn-secondary">Selesai</button>
        </div>
      </div>
      <div id="r-review" class="card hidden"></div>
    </section>
  </main>

  <div id="modal-root"></div>

  <script src="js/seed.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
