<!DOCTYPE html>

<body class="min-h-full font-sans text-slate-800 antialiased">

  <div id="lock" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-100 p-4"></div>

  <div id="app" class="hidden min-h-full lg:pl-64">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform lg:translate-x-0" aria-label="Navigasi utama">
      <div class="flex items-center gap-3 border-b border-slate-100 px-5 py-4">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white">L</div>
        <div class="leading-tight">

      <div class="border-t border-slate-100 p-4">

    <main id="view" class="px-4 py-6 lg:px-8"></main>
  </div>

  <div id="modal-root"></div>

  <script src="js/seed.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
